name: Release & Distributable Packaging

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g. v0.2.0)"
        required: true
        default: "v0.1.1"
        type: string

jobs:
  build-and-publish:
    name: Build & Package (${{ matrix.platform }}${{ matrix.target && format(' - {0}', matrix.target) || '' }})
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: ""
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack & pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.14.0 --activate

      - name: Setup Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install Linux System Dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Frontend Dependencies
        run: pnpm install

      - name: Run Tauri Action (Build & Publish Release)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.tag_name || github.ref_name }}
          releaseName: "MemCard ${{ inputs.tag_name || github.ref_name }}"
          releaseBody: |
            ### Zero-Config Retro Game Save Management & Cloud Sync

            MemCard automates emulator save monitoring, creates atomic local snapshots with Zero Save Loss, and provides seamless 1-click cloud sync across Steam Deck, PC, and macOS.

            #### Distributable Assets
            - **macOS (Apple Silicon M1/M2/M3/M4):** Native `.dmg` disk image installer (Ad-hoc signed)
            - **Windows (x64):** NSIS setup installer (`.exe`) with Start Menu organization
            - **Linux (Steam Deck / Desktop):** Portable `.AppImage` & Debian `.deb` package with SteamOS integration
            - **Verification:** Verified cryptographic hashes in `SHA256SUMS.txt`

            #### 🍎 Note for macOS Users (Unnotarized Open-Source App)
            Because MemCard is a free community open-source project without a paid Apple Developer certificate, macOS Gatekeeper may show an untrusted warning upon first launch.
            - **Easy GUI Method:** In Finder `/Applications`, hold **Control** and click (or right-click) `MemCard.app` -> choose **Open** -> click **Open Anyway**.
            - **Terminal Alternative:** `xattr -cr /Applications/MemCard.app`
          generateReleaseNotes: true
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  checksums:
    name: Generate & Publish SHA256 Manifest
    needs: build-and-publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Download Built Distributables & Generate Hashes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ inputs.tag_name || github.ref_name }}
        run: |
          mkdir -p release-dist
          cd release-dist
          echo "Fetching assets for release: $TAG_NAME"
          gh release download "$TAG_NAME" --repo "${{ github.repository }}" --skip-existing
          
          echo "=== Downloaded Release Files ==="
          ls -la
          
          # Remove existing checksum manifest if re-running
          rm -f SHA256SUMS.txt
          
          # Compute sha256 checksums for all binaries
          sha256sum * > SHA256SUMS.txt
          
          echo "=== Generated SHA256SUMS.txt ==="
          cat SHA256SUMS.txt
          
          gh release upload "$TAG_NAME" SHA256SUMS.txt --repo "${{ github.repository }}" --clobber
