name: Release & Distributable Packaging

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g. v0.2.0)"
        required: true
        default: "v0.1.1"
        type: string

jobs:
  build-and-publish:
    name: Build & Package (${{ matrix.platform }}${{ matrix.target && format(' - {0}', matrix.target) || '' }})
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: ""
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Setup Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux System Dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Frontend Dependencies
        run: pnpm install

      - name: Run Tauri Action (Build & Publish Release)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.tag_name || github.ref_name }}
          releaseName: "MemCard Cloud ${{ inputs.tag_name || github.ref_name }}"
          releaseBody: |
            ### Zero-Config Retro Game Save Management & Cloud Sync

            MemCard Cloud automates emulator save monitoring, creates atomic local snapshots with Zero Save Loss, and provides seamless 1-click cloud sync across Steam Deck, PC, and macOS.

            #### Distributable Assets
            - **macOS (Apple Silicon & Intel):** `.dmg` disk image installer
            - **Windows (x64):** NSIS setup installer (`.exe`)
            - **Linux (Steam Deck / Desktop):** Portable `.AppImage` & Debian `.deb` package
            - **Verification:** Verified cryptographic hashes in `SHA256SUMS.txt`
          generateReleaseNotes: true
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  checksums:
    name: Generate & Publish SHA256 Manifest
    needs: build-and-publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Download Built Distributables & Generate Hashes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ inputs.tag_name || github.ref_name }}
        run: |
          mkdir -p release-dist
          cd release-dist
          echo "Fetching assets for release: $TAG_NAME"
          gh release download "$TAG_NAME" --repo "${{ github.repository }}" --skip-existing
          
          echo "=== Downloaded Release Files ==="
          ls -la
          
          # Remove existing checksum manifest if re-running
          rm -f SHA256SUMS.txt
          
          # Compute sha256 checksums for all binaries
          sha256sum * > SHA256SUMS.txt
          
          echo "=== Generated SHA256SUMS.txt ==="
          cat SHA256SUMS.txt
          
          gh release upload "$TAG_NAME" SHA256SUMS.txt --repo "${{ github.repository }}" --clobber
